plugins {
    id 'com.android.library'
}

android {
//    namespace 'com.bytedance.vepicutureinpicture'
    compileSdk 29

    defaultConfig {
        minSdk 21
        targetSdk 29

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'

    // 直播拉流 SDK，版本统一在根 build.gradle 的 ext.ttlivepullVersion 中维护
    implementation "com.bytedanceapi:ttsdk-ttlivepull_premium:1.51.2.6"
    api project(":vepicutureinpicture:base")
}
